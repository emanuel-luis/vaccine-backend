name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches dependency and image drift

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: elt/uv.lock
      - name: Sync the ELT environment
        run: uv sync --locked --project elt
      - name: Spotless, ruff, mypy, dbt parse
        run: make lint

  web:
    name: web (lint, typecheck, test, build, client drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Typed client matches the committed OpenAPI spec
        run: npm run gen:api && git diff --exit-code -- src/api/schema.ts

  diagrams:
    name: diagrams (D2 render check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the pinned D2 release, checked against its sha256 in the Makefile
      - run: make d2-install
      - run: make diagrams-check
      - name: Upload the rendered SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
          retention-days: 7

  java:
    name: java (unit + Testcontainers)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: make test-java

  python:
    name: python (ELT unit + Testcontainers)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: elt/uv.lock
      - name: Sync the ELT environment
        run: uv sync --locked --project elt
      - name: Pytest
        run: make test-python

  compose-smoke:
    name: end to end (make demo + Playwright)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: elt/uv.lock
      - name: Stack up (Postgres, Keycloak, API), load reference data, generate 20k events, dbt build, reconcile, call every endpoint
        run: make demo ROWS=20000 SEED=42
      - name: Speed layer (post doses, dbt build, reconcile)
        run: make speed-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and the Chromium build
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser e2e (login through Keycloak, dashboards, scope, campaigns, data admin, a11y)
        run: make e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14
      - name: dbt docs
        if: success()
        run: set -a && . ./.env && set +a && PGHOST=localhost PGPORT=5432 PGDATABASE=vaccine PGUSER=vaccine PGPASSWORD="$POSTGRES_PASSWORD" uv run --project elt dbt docs generate --project-dir dbt --profiles-dir dbt
      - name: Upload dbt docs
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
          retention-days: 14
      - name: Load metadata
        if: always()
        run: >
          docker compose exec -T postgres psql -U vaccine -d vaccine -c
          "select table_name, source, rows_read, rows_loaded, rows_rejected
          from ops.load_run_table order by loaded_at desc limit 10"
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: make down
