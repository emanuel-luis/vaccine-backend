name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # weekly: new advisories against unchanged dependencies

permissions:
  contents: read

jobs:
  osv-scanner:
    name: dependency vulnerabilities (Maven + uv + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner on pom.xml, elt/uv.lock and web/package-lock.json
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pom.xml
            --lockfile=elt/uv.lock
            --lockfile=web/package-lock.json
