version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /elt
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript 7 requires TypeScript 5 and typescript-eslint 8 stops at 6.0
      # (DECISIONS 41 and 62): only minor and patch updates of TypeScript.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Java 21 LTS line (DECISIONS 2): only patch/minor updates of the base images.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # The Node major of the build stage moves by hand, to an LTS line only and together with
      # web/.nvmrc, which CI reads (DECISIONS 61): only minor and patch updates of the node image.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      web-images:
        patterns: ["*"]
