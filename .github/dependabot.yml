version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /elt
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Java 21 LTS line (DECISIONS 2): only patch/minor updates of the base images.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
