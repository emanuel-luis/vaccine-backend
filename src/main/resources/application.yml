# Connection settings come from the environment (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD); see .env.example. No credentials live in this file.
spring:
  application:
    name: vaccine-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/vaccine
    username: vaccine
  flyway:
    enabled: true
    # History lives in `ops`; later migrations add the `raw` landing schema.
    default-schema: ops
    schemas: ops
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mustache:
    suffix: .html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
