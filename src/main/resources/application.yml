# Connection settings come from the environment (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD); see .env.example. No credentials live in this file.
spring:
  application:
    name: vaccine-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/vaccine
    username: vaccine
  flyway:
    enabled: true
    # History lives in `ops`; migrations also own `raw`. dbt owns `staging`, `intermediate`,
    # `marts` and `reference`; the API only reads `marts` and `ops`.
    default-schema: ops
    schemas: ops
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
