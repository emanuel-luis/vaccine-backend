# Connection settings come from the environment (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD); see .env.example. No credentials live in this file.
spring:
  application:
    name: vaccine-warehouse
  datasource:
    url: jdbc:postgresql://localhost:5432/vaccine
    username: vaccine
  flyway:
    enabled: true
    # History lives in `ops`; migrations also own `raw`, `live` and `ops`. dbt owns `staging`,
    # `intermediate`, `marts` and `reference`. The API reads `marts`, `ops` and `live`, and writes
    # only raw.live_dose, live.dose_daily and ops.ingest_reject (POST /api/v1/doses).
    default-schema: ops
    schemas: ops
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # With both set, Spring does not call discovery at issuer-uri: keys come from jwk-set-uri
          # (the compose network) and `iss` is still checked against issuer-uri (the browser URL).
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/vaccine}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/vaccine/protocol/openid-connect/certs}
          audiences: vaccine-api

springdoc:
  # Stable, diffable docs/api/openapi.json (checked by OpenApiSpecIT).
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
