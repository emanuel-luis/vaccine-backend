name: vaccine-warehouse

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaccine}
      POSTGRES_USER: ${POSTGRES_USER:-vaccine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env (copy .env.example)}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Substituted into keycloak/realm-vaccine.json on import: no secret lives in git.
      KC_DEMO_PASSWORD: ${KC_DEMO_PASSWORD:?set KC_DEMO_PASSWORD in .env (copy .env.example)}
      SIMULATOR_CLIENT_SECRET: ${SIMULATOR_CLIENT_SECRET:?set SIMULATOR_CLIENT_SECRET in .env (copy .env.example)}
      SMOKE_CLIENT_SECRET: ${SMOKE_CLIENT_SECRET:?set SMOKE_CLIENT_SECRET in .env (copy .env.example)}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8081}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: plain bash /dev/tcp against the management port (Keycloak health guide).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vaccine}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vaccine}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      # `iss` is the browser URL; the keys are fetched on the compose network.
      OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/vaccine
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/vaccine/protocol/openid-connect/certs
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10

volumes:
  pgdata:
