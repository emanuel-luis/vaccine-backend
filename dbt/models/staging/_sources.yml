version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Landing tables owned by Flyway (migration V3) and filled by the ELT package. dbt only reads
      them. The synthetic event tables (migration V4) are not declared yet.
    tables:
      - name: ibge_municipality
        description: IBGE Localidades, one row per municipality (7-digit code) with state and region.
      - name: ibge_census_population
        description: >
          IBGE Censo 2022 (SIDRA 9514): resident population by municipality, sex and single year
          of age, ages 0-6.
      - name: cnes_unit_snapshot
        description: >
          CNES primary-care units, one row per dated extract and unit. Uses 6-digit municipality
          codes. The 2023 extract has no unit type and no coordinates.
