version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Landing tables owned by Flyway (migration V3) and filled by the ELT package. dbt only reads
      them. The vaccine_lot, vaccination_event and vaccine_receipt tables (migration V4) hold
      synthetic data from the seeded generator.
    tables:
      - name: ibge_municipality
        description: IBGE Localidades, one row per municipality (7-digit code) with state and region.
      - name: ibge_census_population
        description: >
          IBGE Censo 2022 (SIDRA 9514): resident population by municipality, sex and single year
          of age, ages 0-6.
      - name: cnes_unit_snapshot
        description: >
          CNES primary-care units, one row per dated extract and unit. Uses 6-digit municipality
          codes. The 2023 extract has no unit type and no coordinates.
      - name: vaccine_lot
        description: Synthetic manufacturing lots, one per vaccine and calendar quarter.
      - name: vaccination_event
        description: >
          Synthetic doses, one row per dose given to one synthetic person. administered_at is
          timestamptz (UTC) of a local time between 08:00 and 17:00 Brasilia time.
      - name: vaccine_receipt
        description: >
          Synthetic lot shipments, one per unit, vaccine and quarter, received on the quarter's
          first business day.
      - name: live_dose
        description: >
          Synthetic doses posted to the API (migration V6), append-only. Every row carries the
          generation that was open when it was inserted; dbt absorbs the closed generations.

  - name: ops
    schema: ops
    description: Run metadata owned by Flyway (migration V2), written by the ELT package.
    tables:
      - name: load_run
        description: One row per ELT run; the generate run records the sample_fraction.
      - name: live_generation_close
        description: >
          One row per closed live generation (migration V6), written by the dbt on-run-start hook
          through ops.close_live_generation().
